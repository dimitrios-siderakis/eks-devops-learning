---
apiVersion: v1
kind: Pod
metadata:
  name: jump-pod
  namespace: stateful-lab
  labels:
    app: jump
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: jump
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 5m
          memory: 8Mi
        limits:
          cpu: 20m
          memory: 16Mi
