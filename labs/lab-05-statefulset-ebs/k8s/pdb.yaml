##############################################################################
# Jump pod for DNS validation
# Adapted from: repo_k8sbook/statefulsets/jump-pod.yml
# Used to: nslookup each pod's stable DNS name from within the cluster
##############################################################################
---
apiVersion: v1
kind: Pod
metadata:
  name: jump-pod
  namespace: stateful-lab
spec:
  containers:
    - name: jump
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tkb-sts-pdb
  namespace: stateful-lab
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: tkb-sts
