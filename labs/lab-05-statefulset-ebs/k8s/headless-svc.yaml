##############################################################################
# Headless Service for StatefulSet DNS
# Adapted from: repo_k8sbook/statefulsets/headless-svc.yml
#
# clusterIP: None → no virtual IP; DNS returns pod IPs directly
# Enables: tkb-sts-0.dullahan.stateful-lab.svc.cluster.local
##############################################################################
---
apiVersion: v1
kind: Service
metadata:
  name: dullahan
  namespace: stateful-lab
  labels:
    app: tkb-sts
spec:
  clusterIP: None
  selector:
    app: tkb-sts
  ports:
    - name: web
      port: 80
      protocol: TCP
