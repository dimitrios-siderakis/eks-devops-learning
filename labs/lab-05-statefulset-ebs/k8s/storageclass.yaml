##############################################################################
# StorageClass — EBS gp3, encrypted
# Adapted from: repo_k8sbook/statefulsets/dd-sc.yml (replaced flash/GKE with EBS)
#
# Key production settings:
#   volumeBindingMode: WaitForFirstConsumer — EBS provisioned in pod's AZ
#   encrypted: true — all volumes encrypted at rest (KMS default or CMK)
#   allowVolumeExpansion: true — resize without recreating PVC
##############################################################################
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3-encrypted
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
    # LOCAL ADAPTATION: provisioner changed to rancher.io/local-path for k3s/Rancher Desktop.
    # On EKS restore to: ebs.csi.aws.com with parameters below.
    # Concepts demonstrated (ordering, DNS, persistence) are identical regardless of backend.
provisioner: rancher.io/local-path
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: false   # local-path does not support online resize
# EKS-only parameters (ignored/removed for local):
# parameters:
#   type: gp3
#   encrypted: "true"
#   throughput: "125"
#   iops: "3000"
