---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: local-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: local-networking-tls
  namespace: production
spec:
  secretName: local-networking-tls
  issuerRef:
    name: local-selfsigned
    kind: ClusterIssuer
  dnsNames:
    - app-local.127.0.0.1.sslip.io
    - api-local.127.0.0.1.sslip.io

