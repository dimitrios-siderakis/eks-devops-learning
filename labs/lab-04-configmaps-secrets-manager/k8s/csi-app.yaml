##############################################################################
# App using Secrets Manager via CSI Driver
# ServiceAccount must be annotated with IRSA role ARN before applying:
#   kubectl annotate sa csi-app-sa -n config-lab \
#     eks.amazonaws.com/role-arn=$(terraform output -raw csi_irsa_role_arn)
##############################################################################
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: csi-app-sa
  namespace: config-lab
  # Annotation added via CLI after terraform apply — see README Step C
---
apiVersion: v1
kind: Pod
metadata:
  name: csi-app
  namespace: config-lab
spec:
  serviceAccountName: csi-app-sa
  restartPolicy: Never
  containers:
    - name: app
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "=== Secrets from AWS Secrets Manager ==="
          echo "DB Password: $(cat /mnt/secrets/db-password)"
          echo "DB Username: $(cat /mnt/secrets/db-username)"
          echo "=== Synced K8s Secret (via env var) ==="
          echo "DB_PASSWORD env: $DB_PASSWORD"
          sleep 3600
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
      env:
        # Reference the synced K8s Secret for env var access
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: synced-db-secret
              key: db-password
      volumeMounts:
        - name: secrets-store
          mountPath: /mnt/secrets
          readOnly: true
  volumes:
    - name: secrets-store
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: aws-sm-db-creds
