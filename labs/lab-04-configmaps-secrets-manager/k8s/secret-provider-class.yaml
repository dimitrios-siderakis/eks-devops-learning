##############################################################################
# SecretProviderClass — AWS Secrets Manager via CSI Driver
#
# Replace <AWS_REGION> and <SECRET_ARN> with values from Terraform output:
#   terraform output -raw secrets_manager_secret_arn
#   terraform output -raw aws_region
##############################################################################
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: aws-sm-db-creds
  namespace: config-lab
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "lab04/db-password"
        objectType: "secretsmanager"
        objectAlias: "db-password"
      - objectName: "lab04/db-username"
        objectType: "secretsmanager"
        objectAlias: "db-username"
  # Sync to a K8s Secret so env vars can also reference it
  secretObjects:
    - secretName: synced-db-secret
      type: Opaque
      data:
        - objectName: db-password
          key: db-password
        - objectName: db-username
          key: db-username
