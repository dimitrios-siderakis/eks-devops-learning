##############################################################################
# Native Kubernetes Secret
# Adapted from: repo_k8sbook/configmaps/tkb-secret.yml + secretpod.yml
#
# ⚠️  DEMONSTRATION ONLY — shows the weakness of native Secrets
# In production: use Secrets Store CSI → AWS Secrets Manager (see csi-app.yaml)
#
# KMS envelope encryption (enabled in Lab 01 eks.tf) encrypts the etcd entry,
# but the Secret value is still base64 in memory and visible to kubectl.
##############################################################################
---
apiVersion: v1
kind: Secret
metadata:
  name: tkb-secret
  namespace: config-lab
  labels:
    purpose: demonstration
type: Opaque
data:
  # echo -n 'nigelpoulton' | base64
  username: bmlnZWxwb3VsdG9u
  # echo -n 'Password123' | base64
  password: UGFzc3dvcmQxMjM=
---
apiVersion: v1
kind: Pod
metadata:
  name: secret-pod
  namespace: config-lab
spec:
  restartPolicy: Never
  containers:
    - name: ctr
      image: busybox:1.36
      command: ["sh", "-c", "echo username=$(cat /etc/tkb/username) && echo password=$(cat /etc/tkb/password)"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
      volumeMounts:
        - name: secret-vol
          mountPath: /etc/tkb
          readOnly: true
  volumes:
    - name: secret-vol
      secret:
        secretName: tkb-secret
        defaultMode: 0400   # read-only for owner only
