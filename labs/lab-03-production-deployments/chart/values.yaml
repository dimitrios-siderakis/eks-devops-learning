namespace:
  create: true
  name: web
  labels:
    env: production
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted

nameOverride: ""
fullnameOverride: web-app

replicaCount: 3
revisionHistoryLimit: 5
progressDeadlineSeconds: 120
minReadySeconds: 10
terminationGracePeriodSeconds: 30
changeCause: "v1 - initial Helm release"

image:
  repository: nigelpoulton/getting-started-k8s
  tag: "1.0"
  pullPolicy: IfNotPresent

podLabels: {}

service:
  name: web-app-svc
  type: ClusterIP
  port: 80
  targetPort: http
  containerPort: 8080

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 128Mi

startupProbe:
  httpGet:
    path: /
    port: http
  failureThreshold: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3
  successThreshold: 1

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
  failureThreshold: 3

lifecycle:
  preStop:
    exec:
      command:
        - /bin/sh
        - -c
        - sleep 5

topologySpreadConstraints:
  enabled: true
  maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: DoNotSchedule

hpa:
  enabled: true
  name: web-app-hpa
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30

pdb:
  enabled: true
  name: web-app-pdb
  minAvailable: 2

nodeSelector: {}
tolerations: []
affinity: {}
