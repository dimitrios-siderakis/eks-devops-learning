##############################################################################
# Production Deployment — v1
# Adapted from: repo_getting_started/Deployments/deploy-complete.yml
#               repo_k8sbook/deployments/deploy.yml
#
# Production additions over Poulton's originals:
#  - requests (not just limits) → enables HPA + proper scheduling
#  - readiness, liveness, startup probes
#  - realistic terminationGracePeriodSeconds
#  - preStop lifecycle hook for graceful drain
#  - topologySpreadConstraints for multi-AZ distribution
##############################################################################
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: web
  annotations:
    kubernetes.io/change-cause: "v1 — initial release"
spec:
  replicas: 3
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 120
  minReadySeconds: 10
  selector:
    matchLabels:
      app: web-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # zero-downtime: never kill before new is ready
      maxSurge: 1         # one extra pod during rollout
  template:
    metadata:
      labels:
        app: web-app
        version: v1
    spec:
      terminationGracePeriodSeconds: 30

      # Spread pods across AZs — prevents all pods landing in one AZ
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: web-app

      containers:
        - name: web-ctr
          image: nigelpoulton/getting-started-k8s:1.0
          ports:
            - containerPort: 8080
              name: http

          # CRITICAL: always set both requests AND limits
          # requests → used by scheduler + HPA
          # limits   → OOM kill threshold
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi

          # startupProbe: gives slow-starting containers time to init
          # before liveness kicks in. Prevents premature restarts.
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30   # 30 * 10s = 5 min max startup time
            periodSeconds: 10

          # readinessProbe: gates traffic. Pod removed from Service
          # endpoints until this passes.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1

          # livenessProbe: restarts the container if it becomes hung/unhealthy.
          # Should be LESS aggressive than readiness.
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3

          # preStop: gives in-flight requests time to drain before SIGTERM
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
