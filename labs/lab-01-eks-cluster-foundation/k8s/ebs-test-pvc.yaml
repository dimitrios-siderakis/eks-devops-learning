##############################################################################
# EBS CSI Validation
#
# Creates a PVC using the gp3 StorageClass provisioned by the EBS CSI driver.
# Deploys a pod that writes a file to the volume, then prints it.
#
# Validate:
#   kubectl get pvc ebs-test-pvc          # should be Bound
#   kubectl logs ebs-test-pod             # should print "EBS volume works"
#   aws ec2 describe-volumes --filters Name=tag:kubernetes.io/cluster/lab01-eks,Values=owned
##############################################################################
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer   # only provision when pod is scheduled
reclaimPolicy: Delete
allowVolumeExpansion: true
parameters:
  type: gp3
  encrypted: "true"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ebs-test-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: ebs-test-pod
  namespace: default
spec:
  restartPolicy: Never
  containers:
    - name: writer
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "EBS volume works" > /data/test.txt
          cat /data/test.txt
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: ebs-test-pvc
