##############################################################################
# Stub postgres Service — apply this to unblock the init container
# In production this would be your real database Service
##############################################################################
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: init-lab
spec:
  selector:
    app: postgres-stub
  ports:
    - port: 5432
      targetPort: 5432
---
# Minimal stub pod so the Service has an endpoint and DNS resolves
apiVersion: v1
kind: Pod
metadata:
  name: postgres-stub
  namespace: init-lab
  labels:
    app: postgres-stub
spec:
  containers:
    - name: pg
      image: busybox:1.36
      command: ["nc", "-lk", "-p", "5432"]
      resources:
        requests:
          cpu: 5m
          memory: 8Mi
        limits:
          cpu: 20m
          memory: 16Mi
