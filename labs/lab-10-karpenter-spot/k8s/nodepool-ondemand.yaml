##############################################################################
# NodePool — On-Demand
# For critical or stateful workloads that must not be interrupted.
# Uses taint to require explicit opt-in.
##############################################################################
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: on-demand
spec:
  template:
    metadata:
      labels:
        workload-type: stable
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default

      # Taint: pods must explicitly tolerate this to land on OD nodes
      taints:
        - key: on-demand
          value: "true"
          effect: NoSchedule

      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]

        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - m6i.xlarge
            - m6a.xlarge
            - m5.xlarge

        - key: topology.kubernetes.io/zone
          operator: In
          values:
            - us-east-1a
            - us-east-1b
            - us-east-1c

        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]

        - key: kubernetes.io/os
          operator: In
          values: ["linux"]

  limits:
    cpu: "16"        # max 4 OD nodes (4 vCPU each)
    memory: 64Gi

  disruption:
    # Only consolidate when node is fully empty — never move running OD pods
    consolidationPolicy: WhenEmpty
    consolidateAfter: 1m

  weight: 50   # Higher weight → scheduler prefers OD for pods that tolerate it
