##############################################################################
# NodePool — Spot
# For stateless burst workloads.
# Uses diversified instance types across families + AZs for best Spot availability.
##############################################################################
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: spot
spec:
  template:
    metadata:
      labels:
        workload-type: burst
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default

      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]

        # Diversify across x86 instance families for better Spot availability
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - m6i.large
            - m6a.large
            - m5.large
            - m5a.large
            - c6i.large
            - c6a.large

        # All 3 AZs — critical for Spot availability (AZ diversity = more pools)
        - key: topology.kubernetes.io/zone
          operator: In
          values:
            - us-east-1a
            - us-east-1b
            - us-east-1c

        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]

        - key: kubernetes.io/os
          operator: In
          values: ["linux"]

  # Budget: max 20 Spot nodes at once
  limits:
    cpu: "80"        # ~20 × 4 vCPU (m6i.large = 2 vCPU — adjust per instance)
    memory: 160Gi

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s    # aggressive for lab; use 5m in production

  # Weight for scheduler priority (higher = preferred)
  weight: 10
